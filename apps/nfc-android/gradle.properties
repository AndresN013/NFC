# Memoria del demonio de Gradle. Un proyecto Compose con KSP necesita mas que
# el valor por defecto.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Compilacion en paralelo y cache: la planta trabaja con equipos modestos, pero
# esto solo afecta a la maquina de desarrollo.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX es obligatorio para Compose.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Estilo de codigo oficial de Kotlin.
kotlin.code.style=official
